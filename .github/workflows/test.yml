name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff>=0.9

      - name: Ruff check
        run: ruff check agent.py api_server.py interactive_cli.py onboard.py service_mode.py core web tests

      - name: Ruff format (check)
        run: ruff format --check agent.py api_server.py interactive_cli.py onboard.py service_mode.py core web tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all-llm]"

      - name: Run tests
        run: pytest tests/ -q --tb=short
        env:
          PYBOT_RUNTIME_HOME: /tmp/pybot_ci_runtime
          PYBOT_API_KEYS: ci-test-key:*
