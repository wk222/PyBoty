repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        files: ^(agent\.py|api_server\.py|interactive_cli\.py|onboard\.py|service_mode\.py|core/.*\.py|web/.*\.py|tests/.*\.py)$
      - id: ruff-format
        files: ^(agent\.py|api_server\.py|interactive_cli\.py|onboard\.py|service_mode\.py|core/.*\.py|web/.*\.py|tests/.*\.py)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^(agent\.py|api_server\.py|interactive_cli\.py|onboard\.py|service_mode\.py|core/.*\.py|web/.*\.py|tests/.*\.py|\.pre-commit-config\.yaml|\.github/workflows/test\.yml|pyproject\.toml)$
      - id: trailing-whitespace
        files: ^(agent\.py|api_server\.py|interactive_cli\.py|onboard\.py|service_mode\.py|core/.*\.py|web/.*\.py|tests/.*\.py|\.pre-commit-config\.yaml|\.github/workflows/test\.yml|pyproject\.toml)$
      - id: check-merge-conflict
        files: ^(agent\.py|api_server\.py|interactive_cli\.py|onboard\.py|service_mode\.py|core/.*\.py|web/.*\.py|tests/.*\.py|\.pre-commit-config\.yaml|\.github/workflows/test\.yml|pyproject\.toml)$
      - id: check-yaml
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/test\.yml)$
