[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybot"
version = "0.1.0"
description = "A multi-agent Python platform with dynamic tools, workflows, and sub-apps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "wzx" }]
dependencies = [
  "fastapi>=0.100.0",
  "langchain>=1.0.0a1",
  "langchain-openai>=0.3.0",
  "langgraph>=0.3.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "pydantic>=2.0",
  "python-multipart>=0.0.7",
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "ruff>=0.9",
]
anthropic = [
  "langchain-anthropic>=0.3.0",
]
google = [
  "langchain-google-genai>=2.0.0",
]
ollama = [
  "langchain-ollama>=0.3.0",
]
all-llm = [
  "langchain-anthropic>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langchain-ollama>=0.3.0",
  "langchain-mistralai>=0.2.0",
  "langchain-groq>=0.2.0",
]
rag = [
  "chromadb>=0.5.0",
  "langchain-text-splitters>=0.3.0",
]

[project.scripts]
pybot-web = "service_mode:main"
pybot-api = "api_server:main"
pybot-cli = "interactive_cli:main"
pybot-onboard = "onboard:main"

[tool.setuptools]
py-modules = [
  "agent",
  "api_server",
  "interactive_cli",
  "onboard",
  "service_mode",
]

[tool.setuptools.packages.find]
include = ["core", "core.*", "web", "web.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
