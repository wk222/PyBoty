<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataInsight Pro - 数据分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse">
                <div class="position-sticky pt-3 text-white">
                    <h5 class="px-3 mb-4">DataInsight Pro</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="#" onclick="showView('dashboard')">
                                <i class="bi bi-speedometer2 me-2"></i> 仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" onclick="showView('tables')">
                                <i class="bi bi-table me-2"></i> 数据表
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" onclick="showView('sql-editor')">
                                <i class="bi bi-code-square me-2"></i> SQL 编辑器
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" onclick="showView('upload')">
                                <i class="bi bi-cloud-upload me-2"></i> 导入数据
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div id="loading-spinner" class="d-none text-center my-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>

                <!-- Dashboard View -->
                <div id="view-dashboard" class="view-content">
                    <h2 class="mb-4">概览</h2>
                    <div class="row" id="dashboard-stats">
                        <div class="col-md-4 mb-4">
                            <div class="card bg-primary text-white">
                                <div class="card-body">
                                    <h5 class="card-title">总表数</h5>
                                    <h2 id="stat-table-count">0</h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card mt-4">
                        <div class="card-header">最近导入的表</div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush" id="recent-tables-list">
                                <!-- Tables will be listed here -->
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Tables View -->
                <div id="view-tables" class="view-content d-none">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2>数据表分析</h2>
                        <select id="table-selector" class="form-select w-25" onchange="loadTableData()">
                            <option value="">选择一个表...</option>
                        </select>
                    </div>
                    
                    <ul class="nav nav-tabs mb-3" id="tableTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="preview-tab" data-bs-toggle="tab" data-bs-target="#preview-pane" type="button" role="tab">数据预览</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats-pane" type="button" role="tab">字段分布</button>
                        </li>
                    </ul>
                    <div class="tab-content" id="tableTabContent">
                        <div class="tab-pane fade show active" id="preview-pane" role="tabpanel">
                            <div class="table-responsive">
                                <table id="preview-table" class="table table-striped table-sm">
                                    <thead><tr id="preview-thead"></tr></thead>
                                    <tbody id="preview-tbody"></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="stats-pane" role="tabpanel">
                            <div id="charts-container" class="row">
                                <!-- Charts will be injected here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SQL Editor View -->
                <div id="view-sql-editor" class="view-content d-none">
                    <h2 class="mb-4">SQL 编辑器</h2>
                    <div class="mb-3">
                        <textarea id="sql-query" class="form-control font-monospace" rows="5" placeholder="SELECT * FROM table_name LIMIT 10"></textarea>
                    </div>
                    <button class="btn btn-primary mb-4" onclick="runSqlQuery()">运行查询</button>
                    
                    <div id="sql-results-container" class="d-none">
                        <h4>查询结果</h4>
                        <div class="table-responsive mt-3">
                            <table id="sql-results-table" class="table table-hover table-sm">
                                <thead id="sql-thead"></thead>
                                <tbody id="sql-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Upload View -->
                <div id="view-upload" class="view-content d-none">
                    <h2 class="mb-4">导入新数据</h2>
                    <div class="card col-md-6">
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="import-file-path" class="form-label">文件路径 (CSV/Excel)</label>
                                <input type="text" class="form-control" id="import-file-path" placeholder="C:/path/to/data.csv">
                                <div class="form-text">请输入文件的完整路径或相对路径。</div>
                            </div>
                            <div class="mb-3">
                                <label for="import-table-name" class="form-label">目标表名</label>
                                <input type="text" class="form-control" id="import-table-name" placeholder="my_awesome_data">
                            </div>
                            <button class="btn btn-success" onclick="importData()">导入并分析</button>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/pybot-helpers.js"></script>
    <script src="static/app.js"></script>
</body>
</html>
